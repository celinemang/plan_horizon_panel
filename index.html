<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>
    // Existing published survey questions already load this URL with their assignment.
    (function () {
      var url = new URL(location.href);
      var params = url.searchParams;
      if (location.hostname === 'celinemang.github.io' && window.parent !== window &&
          params.has('pid') && !params.has('practice') && !params.has('tutorial') && !params.has('practice_done')) {
        params.set('practice', 'plant');
        history.replaceState(null, '', url.href);
      }
    })();
  </script>
  <title>Plan Panel</title>
  <link rel="stylesheet" href="css/style.css?v=guide5">
</head>
<body>
  <div id="panel" hidden>
    <aside id="toolbox">
      <h2>Toolbox</h2>
      <p class="side-note" id="side-note"></p>
      <div id="toolbox-cards"></div>
    </aside>
    <main id="main">
      <div id="scene-col">
        <section id="unity-area">Unity iframe placeholder</section>
        <div id="replay-bar" hidden aria-label="Robot replay timeline"></div>
      </div>
      <div id="status-bar" hidden></div>
      <section id="done-area" hidden aria-labelledby="done-title">
        <div class="done-head"><h2 id="done-title">The robot has done so far</h2><span id="done-count"></span></div>
        <ol id="done-list"></ol>
      </section>
      <section id="timeline-area">
        <div class="area-head">
          <h2 id="timeline-title">Task Timeline</h2>
          <span id="limit-note"></span>
          <span class="history-btns">
            <button id="undo-btn" type="button" disabled aria-keyshortcuts="Control+Z Meta+Z" title="Undo (Ctrl+Z)">&#8630; Undo</button>
            <button id="redo-btn" type="button" disabled aria-keyshortcuts="Control+Shift+Z Meta+Shift+Z" title="Redo (Ctrl+Shift+Z)">Redo &#8631;</button>
          </span>
        </div>
        <section id="picker" hidden>
          <div class="picker-head">
            <span id="picker-title"></span>
            <button id="picker-cancel" type="button">Cancel</button>
          </div>
          <div id="picker-tiles"></div>
        </section>
        <div id="timeline"></div>
        <section id="places" hidden>
          <p id="places-prompt"></p>
          <div id="places-grid"></div>
        </section>
        <button id="submit-btn" type="button" disabled>Submit</button>
      </section>
    </main>
  </div>
  <div id="practice-pop" hidden role="dialog" aria-modal="true" aria-labelledby="practice-pop-text">
    <div class="practice-pop-box">
      <p id="practice-pop-text"></p>
      <div class="confirm-actions"><button id="practice-pop-ok" type="button">OK</button></div>
    </div>
  </div>
  <div id="confirm" hidden role="dialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-text confirm-count">
    <div class="confirm-box">
      <h3 id="confirm-title">Submit this plan?</h3>
      <p id="confirm-text">You cannot change it afterwards.</p>
      <p id="confirm-count"></p>
      <div class="confirm-actions">
        <button id="confirm-back" type="button">Go back and edit</button>
        <button id="confirm-yes" type="button">Yes, submit</button>
      </div>
    </div>
  </div>
  <p id="idle-note" hidden>Waiting for the study to start. This panel is meant to be opened inside the survey (or through mock_parent.html when testing).</p>
  <script src="js/study-log.js?v=2"></script>
  <script src="js/replay.js?v=1"></script>
  <script src="js/app.js?v=guide5"></script>
</body>
</html>
